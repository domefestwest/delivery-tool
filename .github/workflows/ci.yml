name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # Skip LFS in CI — we don't need ffmpeg binaries to run tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run cross-platform test suite
        run: npm test

      - name: Build React app
        run: npm run build

      - name: Summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "### ✅ Tests passed, build succeeded for v$VERSION" >> $GITHUB_STEP_SUMMARY
